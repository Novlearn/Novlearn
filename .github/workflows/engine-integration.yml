name: Verify Engine integration
on:
  push:
    branches: [codex/integration-engine-staging]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify:engine
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          APP_ENV: staging
          NOVLEARN_ENGINE_ENABLED: 'false'
          NEXT_PUBLIC_SITE_URL: https://staging.novlearn.fr
          NEXT_PUBLIC_SUPABASE_URL: https://tksvbkvfusrnxulpahky.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_build_fixture_only
  duels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: duel-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: duel-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test ../scripts/validate-deployment-env.test.mjs ../scripts/probe-engine-vps-staging.test.mjs
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-test.txt
      - run: python -m pytest
        working-directory: backend

  provision_staging_node_runtime:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/integration-engine-staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Install verified Node.js 24 into the staging-only runtime directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -eu
            version=v24.22.0
            case "$(uname -m)" in
              x86_64) arch=x64 ;;
              aarch64|arm64) arch=arm64 ;;
              *) echo "Unsupported staging VPS architecture"; exit 1 ;;
            esac
            asset="node-${version}-linux-${arch}.tar.xz"
            runtime_root=/opt/novlearn-staging/runtime
            runtime_dir="$runtime_root/node-${version}-linux-${arch}"
            runtime_link="$runtime_root/node"

            sudo mkdir -p "$runtime_root"
            sudo chown "$(id -un):$(id -gn)" "$runtime_root"
            tmp="$(mktemp -d "$runtime_root/.node-${version}.XXXXXX")"
            trap 'rm -rf "$tmp"' EXIT

            if [ -x "$runtime_dir/bin/node" ]; then
              installed_version="$("$runtime_dir/bin/node" --version)"
              if [ "$installed_version" != "$version" ]; then
                echo "Unexpected Node runtime already exists at the staging runtime path"
                exit 1
              fi
            else
              base="https://nodejs.org/dist/${version}"
              curl -fsS "$base/$asset" -o "$tmp/$asset"
              curl -fsS "$base/SHASUMS256.txt" -o "$tmp/SHASUMS256.txt"
              expected="$(awk -v file="$asset" '$2 == file { print $1 }' "$tmp/SHASUMS256.txt")"
              if [ -z "$expected" ]; then
                echo "Official Node.js checksum entry is missing"
                exit 1
              fi
              printf '%s  %s\n' "$expected" "$tmp/$asset" | sha256sum -c -
              mkdir "$tmp/unpacked"
              tar -xJf "$tmp/$asset" --strip-components=1 -C "$tmp/unpacked"
              if [ -e "$runtime_dir" ]; then
                echo "A different Node runtime already occupies the versioned staging path"
                exit 1
              fi
              mv "$tmp/unpacked" "$runtime_dir"
            fi

            if [ -e "$runtime_link" ] && [ ! -L "$runtime_link" ]; then
              echo "The staging Node runtime path exists and is not a symlink; refusing to replace it"
              exit 1
            fi
            ln -sfn "$runtime_dir" "$runtime_link"
            "$runtime_link/bin/node" --version
            "$runtime_link/bin/npm" --version

  qualify_staging_host:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/integration-engine-staging'
    needs: provision_staging_node_runtime
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check staging configuration names without disclosing values
        env:
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
          NOVLEARN_ENGINE_ENABLED: ${{ vars.NOVLEARN_ENGINE_ENABLED }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in ENGINE_URL ENGINE_TOKEN VPS_HOST VPS_USERNAME VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing staging configuration: $name"; exit 1; fi
          done
          if [ "$ENGINE_URL" != 'http://127.0.0.1:3151/run' ]; then echo '::error::ENGINE_URL must point to staging loopback port 3151'; exit 1; fi
          if [[ ! "$ENGINE_TOKEN" =~ ^[a-f0-9]{64}$ ]]; then echo '::error::ENGINE_TOKEN must be the 64-character staging host token'; exit 1; fi
      - name: Upload read-only probe to staging VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: scripts/probe-engine-vps-staging.mjs
          target: /tmp/novlearn-engine-021-${{ github.run_id }}
      - name: Qualify existing Engine without deployment or business writes
        uses: appleboy/ssh-action@master
        env:
          APP_ENV: staging
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_ENV,ENGINE_URL,ENGINE_TOKEN
          script: |
            set -e
            export PATH="/opt/novlearn-staging/runtime/node/bin:$PATH"
            node -e 'const [major,minor]=process.versions.node.split(".").map(Number);if(major!==24||minor<19)throw new Error("Staging requires Node 24.19+ <25")'
            node /tmp/novlearn-engine-021-${{ github.run_id }}/scripts/probe-engine-vps-staging.mjs
            python3 - <<'PY'
            import pathlib,re
            config=pathlib.Path('/etc/apache2/sites-available/novlearn.fr-le-ssl.conf').read_text()
            blocks=re.findall(r'<VirtualHost\b[^>]*>.*?</VirtualHost>',config,re.S)
            staging=[b for b in blocks if re.search(r'^\s*ServerName\s+staging\.novlearn\.fr\s*$',b,re.M)]
            assert len(staging)==1, 'Staging Apache virtual host unavailable'
            assert re.search(r'ProxyPass\s+/api/exercises\s+http://(?:localhost|127\.0\.0\.1):3001/api/exercises',staging[0]), 'Staging Apache must route /api/exercises to Next port 3001 before generic /api'
            print('PASS: staging Apache exercise route targets Next port 3001; no Apache change')
            PY
      - name: Require activation after host qualification
        env:
          NOVLEARN_ENGINE_ENABLED: ${{ vars.NOVLEARN_ENGINE_ENABLED }}
        run: |
          if [ "$NOVLEARN_ENGINE_ENABLED" != 'true' ]; then echo '::error::Set staging variable NOVLEARN_ENGINE_ENABLED=true after the successful host qualification, before deployment'; exit 1; fi
